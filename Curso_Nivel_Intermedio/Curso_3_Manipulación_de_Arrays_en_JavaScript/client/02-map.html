<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso de Map para Transformaciones en JavaScript y Renderizado HTML</title>
</head>

<body>
    <div id="app"></div>
    <script>
        const products = [{
            title: 'Burger',
            precio: 120
        }, {
            title: 'Pizza',
            precio: 90
        }, ]

        const app = document.getElementById('app')
        const lis = products.map(product => {
            return `<li>${product.title} - $${product.precio}</li>`
        })

        app.innerHTML = lis.join('')
    </script>
</body>

</html>

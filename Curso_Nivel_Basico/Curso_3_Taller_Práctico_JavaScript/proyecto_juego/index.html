<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego carritos </title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div class="game-container">
        <canvas id="juego"></canvas>

        <div class="btns">
            <button id="btnArriba">Arriba</button>
            <button id="btnIzquierda">Izquierda</button>
            <button id="btnDerecha">Derecha</button>
            <button id="btnAbajo">Abajo</button>
        </div>

        <div class="mesages">
            <p>Vidas: <span id="lives"></span></p>
            <p>Tiempo: <span id="time"></span></p>
            <p>Record: <span id="record"></span></p>
            <p id="result"></p>
            <button id="btnRestart">Volver a jugar</button>
        </div>

    </div>
    <script src="./maps.js"></script>
    <script src="./game.js"></script>
</body>

</html>

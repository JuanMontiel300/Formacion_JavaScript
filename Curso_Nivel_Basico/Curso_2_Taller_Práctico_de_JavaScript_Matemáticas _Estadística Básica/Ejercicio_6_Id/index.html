<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta por ID</title>
    <style>
         :root {
            color-scheme: light;
            --ink: #1c302e;
            --muted: #60716d;
            --paper: #fffefa;
            --line: #dce5dc;
            --green: #216b5c;
            --green-dark: #17483f;
            --gold: #e8b552;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background: radial-gradient(circle at 90% 8%, rgba(232, 181, 82, 0.2), transparent 24rem), linear-gradient(135deg, #edf4ef, #f8f5eb);
            font-family: "Trebuchet MS", sans-serif;
        }
        
        .page-shell {
            width: min(100% - 40px, 920px);
            margin: 0 auto;
            padding: 64px 0 48px;
        }
        
        .page-heading {
            margin-bottom: 30px;
        }
        
        .eyebrow,
        .panel-kicker {
            margin: 0 0 10px;
            color: var(--green);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        
        h1,
        h2,
        p {
            margin-top: 0;
        }
        
        h1 {
            margin-bottom: 8px;
            font-family: Georgia, serif;
            font-size: 2.6rem;
            font-weight: 500;
        }
        
        .subtitle {
            margin-bottom: 0;
            color: var(--muted);
        }
        
        .lookup-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }
        
        .lookup-panel {
            padding: 24px;
            border: 1px solid var(--line);
            border-top: 4px solid var(--green);
            border-radius: 6px;
            background: var(--paper);
            box-shadow: 0 12px 28px rgba(28, 48, 46, 0.06);
        }
        
        .lookup-panel--user {
            border-top-color: var(--gold);
        }
        
        h2 {
            margin-bottom: 20px;
            font-family: Georgia, serif;
            font-size: 1.45rem;
            font-weight: 500;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 0.9rem;
        }
        
        .field-row {
            display: flex;
            gap: 8px;
        }
        
        input {
            width: 100%;
            min-width: 0;
            padding: 11px 12px;
            border: 1px solid #cbd8cf;
            border-radius: 4px;
            background: #fff;
            color: var(--ink);
            font: inherit;
        }
        
        input:focus-visible,
        button:focus-visible {
            outline: 3px solid rgba(33, 107, 92, 0.28);
            outline-offset: 2px;
        }
        
        button {
            flex: 0 0 auto;
            padding: 0 16px;
            border: 0;
            border-radius: 4px;
            background: var(--green);
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 140ms ease, transform 140ms ease;
        }
        
        button:hover {
            background: var(--green-dark);
            transform: translateY(-1px);
        }
        
        .result-panel {
            margin-top: 16px;
            padding: 20px 24px;
            border-left: 4px solid var(--gold);
            border-radius: 4px;
            background: rgba(255, 254, 250, 0.78);
        }
        
        .result-panel p:last-child {
            margin-bottom: 0;
        }
        
        @media (max-width: 620px) {
            .page-shell {
                width: min(100% - 28px, 460px);
                padding-top: 40px;
            }
            h1 {
                font-size: 2.1rem;
            }
            .lookup-grid {
                grid-template-columns: 1fr;
            }
            .lookup-panel {
                padding: 20px;
            }
        }
        
        .container__content>div:nth-child(3) {
            width: 50px;
            height: 100px;
        }
    </style>
</head>

<body>
    <main class="page-shell">
        <header class="page-heading">
            <p class="eyebrow">Práctica de JavaScript</p>
            <h1>Consulta por ID</h1>
            <p class="subtitle">Productos y usuarios</p>
        </header>

        <section class="lookup-grid" aria-label="Búsqueda por identificador">
            <div class="lookup-panel">
                <p class="panel-kicker">Catálogo · 01</p>
                <h2>Producto</h2>
                <label for="id-producto">ID del producto</label>
                <div class="field-row">
                    <input id="id-producto" type="number" min="1" placeholder="Ej. 1">
                    <button id="btn-producto" type="button">Buscar</button>
                </div>
            </div>

            <div class="lookup-panel lookup-panel--user">
                <p class="panel-kicker">Directorio · 02</p>
                <h2>Usuario</h2>
                <label for="id-usuario">ID del usuario</label>
                <div class="field-row">
                    <input id="id-usuario" type="number" min="1" placeholder="">
                    <button id="btn-usuario" type="button">Buscar</button>
                </div>
            </div>
        </section>

        <section class="result-panel" aria-live="polite">
            <p class="panel-kicker">Resultado</p>
            <p id="respuesta">El resultado aparecerá aquí.</p>
        </section>
    </main>
    <script type="module" src="./app.js"></script>
</body>

</html>
